<div class="conteiner">
    <app-section-title title="Chat"></app-section-title>
    <p class="subtitle">Ask me anything about my experience, skills or projects!</p>

    <div class="chat-wrapper">
        <div class="messages" #messagesContainer>
            <div *ngIf="messages.length === 0" class="empty-state">
                <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                    <path d="M240-400h320v-80H240v80Zm0-120h480v-80H240v80Zm0-120h480v-80H240v80ZM80-80v-720q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H240L80-80Zm126-240h594v-480H160v525l46-45Zm-46 0v-480 480Z"/>
                </svg>
                <p>Start a conversation! Ask me about my skills, experience or projects.</p>
            </div>

            <div *ngFor="let msg of messages"
                 class="message"
                 [class.user-message]="msg.role === 'user'"
                 [class.assistant-message]="msg.role === 'assistant'">
                <span class="message-role">{{ msg.role === 'user' ? 'You' : 'Martin' }}</span>
                <p class="message-content">{{ msg.content }}</p>
            </div>

            <div *ngIf="isLoading" class="message assistant-message">
                <span class="message-role">Martin</span>
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

        <div class="input-area">
            <textarea
                [(ngModel)]="inputMessage"
                (keydown)="onKeyDown($event)"
                placeholder="Ask a question... (Enter to send)"
                rows="2"
                class="chat-input"
                [disabled]="isLoading">
            </textarea>
            <button
                (click)="sendMessage()"
                [disabled]="isLoading || !inputMessage.trim()"
                class="send-btn"
                title="Send message">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                    <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/>
                </svg>
            </button>
        </div>
    </div>
</div>
