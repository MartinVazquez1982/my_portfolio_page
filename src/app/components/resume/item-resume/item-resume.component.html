<div class="card">
    <div class="card-meta">
        <p class="institure">{{ item_resume.institure }}</p>
        <p class="date">{{ item_resume.date }}</p>
    </div>
    <h5 class="job">{{ item_resume.title }}</h5>
    <ul class="description">
        <li *ngFor="let point of item_resume.description">{{ point }}</li>
    </ul>
</div>
